# Triage agent manifest (docs/architecture.md §8.1). Checked against the model registry
# (config/models/, §8.4) before the agent starts: packages/agents/src/ais0c_agents/manifest.py.
id: triage
version: 1.1.0
role: "QRadar offense ilk değerlendirmesi"
workflow_types: [case]
model_alias: soc-fast
required_model_capabilities: [tool_calling, structured_output]
input_schema: TriageTask
output_schema: TriageResult
# Gateway profile; its tools are defined with the gateway profiles (T-011).
toolset_profile: qradar-triage-read
# Model requests per run, output retries included.
max_steps: 8
budgets:
  # Reasoning tokens count too; 60000 (the §8.1 example) ran out on the lab e2e with a
  # dev model. T-030 measures the real budget.
  tokens: 150000
  tool_calls: 12
  # Enforced by the Temporal activity and workflow timeouts (T-012).
  # 180 (the §8.1 example) ran out on the lab e2e with a slow dev model and a worker restart
  # (30 s heartbeat timeout). Still inside the 10-minute critical/high SLA; T-030 measures it.
  wall_clock_seconds: 420
autonomy: L0
can_delegate: false
prompt: prompts/triage/v2.md
# Shared rules version the prompt is assembled with (docs/impl/prompts.md, T-015).
shared_rules: prompts/_shared/rules/v2.md
eval_suites: [triage-gold, prompt-injection, failure-recovery, trust-layers]
