# Orchestrator agent manifest (docs/architecture.md §8.1, §7). Checked against the model
# registry (config/models/, §8.4) before the agent starts: packages/agents/src/ais0c_agents/manifest.py.
id: orchestrator
version: 1.0.0
role: "Vaka planı: Triage sonucundan ve aday skill'lerden CasePlan üretir"
workflow_types: [case]
model_alias: soc-reasoning
# No tools: the plan comes back through the structured output alone.
required_model_capabilities: [structured_output]
input_schema: OrchestratorTask
output_schema: CasePlan
# The Orchestrator has no product tools (architecture §7); it sees only the case state.
toolset_profile: null
# Model requests per run, output retries included.
max_steps: 4
budgets:
  # Starting values until T-030 measures them.
  tokens: 40000
  tool_calls: 0
  # Enforced by the Temporal activity and workflow timeouts (T-012).
  wall_clock_seconds: 90
autonomy: L0
# The workflow validates the plan and runs its steps (decision T-41); the agent starts nothing.
can_delegate: false
prompt: prompts/orchestrator/v1.md
# Shared rules version the prompt is assembled with (docs/impl/prompts.md, T-015).
shared_rules: prompts/_shared/rules/v2.md
eval_suites: [orchestrator-gold, skill-selection, prompt-injection, failure-recovery, trust-layers]
