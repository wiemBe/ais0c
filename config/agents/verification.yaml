# Verification agent manifest (docs/architecture.md §8.1, §7). Checked against the model
# registry (config/models/, §8.4) before the agent starts: packages/agents/src/ais0c_agents/manifest.py.
id: verification
version: 1.1.0
role: "Vaka kararının bağımsız doğrulaması"
workflow_types: [case]
# A different model family from the agents whose decision it checks (D-21, D-39).
model_alias: soc-verifier
required_model_capabilities: [tool_calling, structured_output]
input_schema: VerificationTask
output_schema: VerificationResult
# Narrow window, no free text in the results (architecture §11.2): at most a 2-hour query and
# 200 rows, with payload and free-text fields dropped by the gateway profile.
toolset_profile: qradar-verify-read
# Model requests per run, output retries included.
max_steps: 16
budgets:
  # Starting values until T-030 measures them. T-051: 80 000 was under one run of the lab e2e
  # (case-34, 2026-10-06: 8 requests, 82 377 tokens, 6 tool calls, the last of them the model's
  # correction of a schema-invalid answer, so the run crossed the limit with no result).
  tokens: 120000
  tool_calls: 12
  # Enforced by the Temporal activity and workflow timeouts (T-012).
  wall_clock_seconds: 180
autonomy: L0
can_delegate: false
prompt: prompts/verification/v2.md
# Shared rules version the prompt is assembled with (docs/impl/prompts.md, T-015).
shared_rules: prompts/_shared/rules/v2.md
eval_suites: [verification-gold, prompt-injection, failure-recovery, trust-layers]