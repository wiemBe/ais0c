# QRadar connector manifest (architecture §8.2).
#
# The MCP server is the platform fork of IBM/qradar-mcp, kept in its own repository
# (docs/impl/repo-structure.md). Tool names are the fork's real names; they differ from
# the example names in architecture §8.2, e.g. ariel_search_create is create_ariel_search.
#
# server_profiles are the fork's --profile values. Each runs as its own instance with its
# own QRadar token (§11.2). The MCP Policy Gateway (services/mcp-gateway) reads the rest of
# this file: the tool registry, the gateway profiles, the quota pools and the limits. Gateway
# profiles may only use tools listed in their server profile. The rules each gateway profile
# is held to (AQL Guard, ToolIntent window, output filter, text rules) are in
# config/policies/qradar.yaml.
id: qradar
server: qradar-mcp-fork
# Fork commit with the T-006 and T-040 changes; the input schemas under `tools` are its
# snapshots. Replace with the fork's merge commit or image tag once the fork PR is merged. The dev
# stack runs the image qradar-mcp-fork:<server_version> (deploy/compose/docker-compose.dev.yaml);
# change both together.
server_version: 7dcf3ce72062978e74975c7bca4f77e21d383a68
upstream:
  repository: https://github.com/IBM/qradar-mcp
  commit: f51c0070f0b480c401fd527b0bf5b8e1bf360169
transport: streamable-http
endpoint: /mcp
health_check: /healthz
capability_discovery: /api/help/versions
# Known versions; the server picks the highest one QRadar serves. Lab verification is
# reported in the T-006 PR.
supported_api_versions: ["27.0", "29.0"]
# The gateway records evidence from this connector under this EvidenceSource.
evidence_source: qradar
server_profiles:
  qradar-read:
    instance: qradar-mcp-read
    tools:
      - {id: get_offense, risk: read}
      - {id: list_offenses, risk: read}
      - {id: list_offense_types, risk: read}
      - {id: list_offense_closing_reasons, risk: read}
      - {id: list_source_addresses, risk: read}
      - {id: list_local_destination_addresses, risk: read}
      - {id: list_rules, risk: read}
      - {id: get_rule, risk: read}
      - {id: list_assets, risk: read}
      - {id: list_log_sources, risk: read}
      - {id: get_log_source, risk: read}
      - {id: list_log_source_types, risk: read}
      - {id: list_reference_sets, risk: read}
      - {id: get_reference_set, risk: read}
      - {id: list_reference_maps, risk: read}
      - {id: get_reference_map, risk: read}
      - {id: list_reference_tables, risk: read}
      - {id: get_reference_table, risk: read}
      - {id: create_ariel_search, risk: read}
      - {id: get_ariel_search_status, risk: read}
      - {id: get_ariel_search_results, risk: read}
      # The fork deletes only searches it created itself.
      - {id: delete_ariel_search, risk: read}
  qradar-note:
    # Only the Action Executor uses this instance (profile qradar-note-write). It has a write
    # tool, so the gateway refuses to start if an agent profile uses it.
    instance: qradar-mcp-note
    tools:
      - {id: add_offense_note, risk: write}
      - {id: get_offense_notes, risk: read}

# Tool registry (architecture §13.3): the descriptions and input schemas agents see. They come
# from here only; the gateway never reads tool metadata from the MCP server, so text in the
# server's descriptions cannot reach an agent. The input schemas are the fork's snapshots at
# server_version with platform limits added: free-form strings have a maxLength and an AQL
# query fits EvidenceRef.query_text (4000). The tool_schema_version agents send is a hash of
# input_schema, so it changes whenever the schema does.
#
# result: object (the tool returns one object, one row) or {rows: <key>} (the rows under that
#   key). search: the tool's step in the Ariel search lifecycle. page_size_argument: the
#   argument the gateway lowers to the profile's max_rows.
tools:
  get_offense:
    description: 'Read one QRadar offense by ID: description, offense type and source, rule and category
      lists, event count, magnitude, log sources and times.'
    cost_class: low
    result: object
    input_schema:
      type: object
      additionalProperties: false
      required: [offense_id]
      properties:
        offense_id: {type: integer, minimum: 0, description: The ID of the offense to retrieve}
  list_offenses:
    description: List QRadar offenses. Narrow the list with filter (QRadar API filter syntax, for
      example status = OPEN), pick fields and sort; page with limit and offset.
    cost_class: low
    result: {rows: offenses}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: assigned_to, categories, category_count, close_time, closing_reason_id, closing_user, credibility, description, destination_networks, device_count, domain_id, event_count, first_persisted_time, flow_count, follow_up, id, inactive, last_persisted_time, last_updated_time, local_destination_address_ids, local_destination_count, log_sources, magnitude, offense_source, offense_type, policy_category_count, protected, relevance, remote_destination_count, rules, security_category_count, severity, source_address_ids, source_count, source_network, start_time, status, username_count. There is no name field: the text of an offense is description. Nested fields use parentheses with only these names: rules(id), log_sources(id,name).'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. A field that holds a list takes contains. description, offense_source and source_network cannot be filtered: for other offenses of the same source, filter source_address_ids contains with the IDs from this offense. Examples: `status = 'OPEN'`; `id in (18,19)`; `source_address_ids contains 13`; `rules contains id = 100001`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of offenses to return (default: 10, max: 10000)'}
        offset: {type: integer, minimum: 0, default: 0, description: 'Number of offenses to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  list_offense_types:
    description: 'List offense types: the property an offense is indexed on, such as source IP or
      username.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: custom, database_type, id, name, property_name.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `id in (0,3)`; `property_name = 'sourceIP'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of results to return (default: 10)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  list_source_addresses:
    description: List offense source addresses with the offenses they appear in.
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: domain_id, event_flow_count, first_event_flow_seen, id, last_event_flow_seen, local_destination_address_ids, magnitude, network, offense_ids, source_ip.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. id is the numeric address ID from an offense's source_address_ids, never an IP address. Examples: `source_ip = '192.0.2.1'`; `source_ip in ('192.0.2.1','192.0.2.2')`; `id in (13,14)`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of results to return (default: 10)'}
        offset: {type: integer, minimum: 0, description: Starting position for pagination (0-based)}
  list_local_destination_addresses:
    description: List local destination addresses of offenses with the offenses they appear in.
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: domain_id, event_flow_count, first_event_flow_seen, id, last_event_flow_seen, local_destination_ip, magnitude, network, offense_ids, source_address_ids.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. id is the numeric address ID from an offense's local_destination_address_ids, never an IP address. Examples: `local_destination_ip = '192.0.2.1'`; `local_destination_ip in ('192.0.2.1','192.0.2.2')`; `id in (13,14)`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of results to return (default: 10)'}
  list_rules:
    description: 'List QRadar analytics rules: ID, name, type, enabled state and origin.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: average_capacity, base_capacity, base_host_id, capacity_timestamp, creation_date, enabled, id, identifier, linked_rule_identifier, modification_date, name, origin, owner, type.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. ilike matches a string case-insensitively, with % as a wildcard. Examples: `id in (100001,100002)`; `enabled = true and origin = 'USER'`; `name ilike '%brute force%'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of rules to return (default: 10, max: 10000)'}
        offset: {type: integer, minimum: 0, default: 0, description: 'Number of rules to skip for pagination (default: 0)'}
  get_rule:
    description: Read one QRadar analytics rule by ID.
    cost_class: low
    result: object
    input_schema:
      type: object
      additionalProperties: false
      required: [rule_id]
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: average_capacity, base_capacity, base_host_id, capacity_timestamp, creation_date, enabled, id, identifier, linked_rule_identifier, modification_date, name, origin, owner, type.'}
        rule_id: {type: integer, minimum: 0, description: The ID of the analytics rule to retrieve}
  list_assets:
    description: 'List assets from the QRadar asset model: IP addresses, host names, users and properties. Look up an IP address or host name with filter instead of reading every asset.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: domain_id, hostnames, id, interfaces, products, properties, risk_score_sum, vulnerability_count.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. IP addresses and host names sit in lists of objects, so they are matched with contains as in the examples. id is the numeric asset ID, never an IP address. Examples: `interfaces contains ip_addresses contains value = '192.0.2.1'`; `interfaces contains ip_addresses contains value in ('192.0.2.1','192.0.2.2')`; `hostnames contains name = 'host01.example.com'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, description: 'Maximum number of assets to return (default: 50, max: 10000)'}
        offset: {type: integer, minimum: 0, description: 'Number of assets to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  list_log_sources:
    description: 'List log sources: ID, name, type, enabled state and status.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: auto_discovered, average_eps, coalesce_events, creation_date, credibility, description, enabled, gateway, group_ids, id, internal, language_id, last_event_time, modified_date, name, protocol_type_id, requires_deploy, status, store_event_payload, target_event_collector_id, type_id.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `id in (101,102)`; `type_id = 12 and enabled = true`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of log sources to return (default: 10, max: 10000)'}
        offset: {type: integer, minimum: 0, default: 0, description: 'Number of log sources to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  get_log_source:
    description: Read one log source by ID.
    cost_class: low
    result: object
    input_schema:
      type: object
      additionalProperties: false
      required: [log_source_id]
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: auto_discovered, average_eps, coalesce_events, creation_date, credibility, description, enabled, gateway, group_ids, id, internal, language_id, last_event_time, modified_date, name, protocol_type_id, requires_deploy, status, store_event_payload, target_event_collector_id, type_id.'}
        log_source_id: {type: integer, minimum: 0, description: The ID of the log source to retrieve}
  list_log_source_types:
    description: 'List log source types: ID and name.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: custom, default_protocol_id, id, internal, language_ids, log_source_extension_id, name, protocol_types, uuid.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `id in (12,13)`; `name = 'Microsoft Windows Security Event Log'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 10, description: 'Maximum number of types to return (default: 10)'}
        offset: {type: integer, minimum: 0, description: Starting index for pagination (0-based)}
  list_reference_sets:
    description: 'List reference sets: name, element type and number of entries.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: description, entry_type, id, name, namespace.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `name = 'Web Servers'`; `entry_type = 'IP'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, description: 'Maximum number of sets to return (default: 50, max: 10000)'}
        offset: {type: integer, minimum: 0, description: 'Number of sets to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  get_reference_set:
    description: Read one reference set by ID.
    cost_class: low
    result: object
    input_schema:
      type: object
      additionalProperties: false
      required: [set_id]
      properties:
        fields: {type: string, maxLength: 1000, description: 'Optional comma-separated list of fields to return (e.g., ''id,name,entry_type,number_of_entries'')'}
        set_id: {type: integer, minimum: 0, description: The ID of the reference set to retrieve}
  list_reference_maps:
    description: 'List reference maps: name, key and value labels and number of entries.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: creation_time, element_type, key_label, name, namespace, number_of_elements, time_to_live, timeout_type.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `name = 'Admin Accounts'`; `element_type = 'IP'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, description: 'Maximum number of maps to return (default: 50, max: 10000)'}
        offset: {type: integer, minimum: 0, description: 'Number of maps to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  get_reference_map:
    description: Read the entries of one reference map by name; page with limit and offset.
    cost_class: medium
    result: object
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        fields: {type: string, maxLength: 1000, description: Optional comma-separated list of fields to return}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 50, description: 'Maximum number of entries to return (default: 50)'}
        name: {type: string, pattern: '^(?!\.{1,2}$)[^/\\?#%]{1,255}$', description: The name of the reference map to retrieve}
        namespace: {type: string, enum: [SHARED, TENANT], description: 'Optional namespace: SHARED or TENANT (default: SHARED)'}
        offset: {type: integer, minimum: 0, description: 'Number of entries to skip for pagination (default: 0)'}
  list_reference_tables:
    description: 'List reference tables: name, key labels and number of entries.'
    cost_class: low
    result: {rows: items}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fields: {type: string, maxLength: 1000, description: 'Comma-separated field names; omit to get all fields. Valid fields: creation_time, element_type, key_label, name, namespace, number_of_elements, time_to_live, timeout_type.'}
        filter: {type: string, maxLength: 1000, description: "QRadar REST API filter, not AQL: field operator value, joined with and, or and parentheses. Operators: = != < > <= >= and in, which takes a list in parentheses, never square brackets. Strings and IP addresses always go in single quotes, which need no escaping in JSON; numbers and true/false do not. Use only the field names listed for the fields argument. Examples: `name = 'Asset Owners'`; `element_type = 'ALN'`."}
        limit: {type: integer, minimum: 1, maximum: 10000, description: 'Maximum number of tables to return (default: 50, max: 10000)'}
        offset: {type: integer, minimum: 0, description: 'Number of tables to skip for pagination (default: 0)'}
        sort: {type: string, maxLength: 1000, description: 'Comma-separated fields, each prefixed with + (ascending) or - (descending), e.g. -start_time,+id. No ASC or DESC keywords.'}
  get_reference_table:
    description: Read the entries of one reference table by name; page with limit and offset.
    cost_class: medium
    result: object
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        fields: {type: string, maxLength: 1000, description: Optional comma-separated list of fields to return}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 50, description: 'Maximum number of entries to return (default: 50)'}
        name: {type: string, pattern: '^(?!\.{1,2}$)[^/\\?#%]{1,255}$', description: The name of the reference table to retrieve}
        namespace: {type: string, enum: [SHARED, TENANT], description: 'Optional namespace: SHARED or TENANT (default: SHARED)'}
        offset: {type: integer, minimum: 0, description: 'Number of entries to skip for pagination (default: 0)'}
  create_ariel_search:
    description: 'Start an Ariel search for an AQL query on the events table. The query needs a LIMIT
      and then a time range, in this order: ... LIMIT 100 LAST 2 HOURS (or START 1791212263905 STOP
      1791212323905, epoch milliseconds). Events have no eventname field: the event name is
      QIDNAME(qid), a function, and a QID is QRadar''s own numeric event ID, not the Windows event
      ID (4662 is not a QID): find events by QIDNAME(qid) or category, never by guessing a QID.
      Returns the search: poll get_ariel_search_status until it is COMPLETED, read rows with get_ariel_search_results,
      then call delete_ariel_search.'
    cost_class: high
    result: object
    search: create
    input_schema:
      type: object
      additionalProperties: false
      required: [query_expression]
      properties:
        query_expression: {type: string, minLength: 1, maxLength: 4000, description: "The AQL query to run, with a LIMIT and then a time range. The event name is QIDNAME(qid); there is no eventname field, and a QID is QRadar's own numeric event ID, not the Windows event ID (4662 is not a QID): find events by QIDNAME(qid) or category, never by a guessed QID. Example: `SELECT QIDNAME(qid), username, sourceip FROM events WHERE QIDNAME(qid) ILIKE '%directory service%' LIMIT 100 LAST 2 HOURS`."}
  get_ariel_search_status:
    description: Read the status of an Ariel search started in this case or hunt. wait_seconds (at
      most 20) waits for the search to complete.
    cost_class: low
    result: object
    search: status
    input_schema:
      type: object
      additionalProperties: false
      required: [search_id]
      properties:
        search_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: The ID of the Ariel search to retrieve status for}
        wait_seconds: {type: integer, minimum: 0, maximum: 20, description: 'Optional number of seconds to wait for search completion. If specified, the API will wait up to this many seconds for the search to reach COMPLETED status before returning.'}
  get_ariel_search_results:
    description: Read one page of rows of a completed Ariel search started in this case or hunt.
    cost_class: medium
    result: {rows: events}
    search: results
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      required: [search_id]
      properties:
        limit: {type: integer, minimum: 1, maximum: 10000, default: 100, description: Rows in this page (default 100).}
        search_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: The ID of the completed Ariel search to retrieve results for}
        start: {type: integer, minimum: 0, default: 0, description: Starting index for pagination (0-based). Use with limit to retrieve a specific range of results.}
  delete_ariel_search:
    description: Delete an Ariel search started in this case or hunt once its results are no longer
      needed.
    cost_class: low
    result: object
    search: delete
    input_schema:
      type: object
      additionalProperties: false
      required: [search_id]
      properties:
        search_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: The ID of the Ariel search to delete}
  # The note tools are the Action Executor's (profile qradar-note-write); no agent sees them.
  # add_offense_note takes no `fields`: a write tool takes only what the executor needs.
  add_offense_note:
    description: Add a note to a QRadar offense. The text is the Action Executor's note template
      filled with cleaned structured fields (architecture §9); QRadar records the token's user as
      its author.
    cost_class: low
    result: object
    input_schema:
      type: object
      additionalProperties: false
      required: [offense_id, note_text]
      properties:
        note_text: {type: string, minLength: 1, maxLength: 10000, description: The text content of the note}
        offense_id: {type: integer, minimum: 0, description: The ID of the offense to add the note to}
  get_offense_notes:
    description: Read one page of an offense's notes, to check that a note is not written twice;
      page with limit and start.
    cost_class: low
    result: {rows: notes}
    page_size_argument: limit
    input_schema:
      type: object
      additionalProperties: false
      required: [offense_id]
      properties:
        fields: {type: string, maxLength: 1000, description: 'Optional comma-separated list of fields to return (e.g., ''id,note_text,create_time'')'}
        filter: {type: string, maxLength: 1000, description: Optional filter to restrict notes}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50, description: Maximum number of notes to return}
        offense_id: {type: integer, minimum: 0, description: The ID of the offense to retrieve notes for}
        start: {type: integer, minimum: 0, default: 0, description: Starting index for pagination (0-based)}

# Gateway profiles (architecture §8.2, §11.2). An agent manifest names one as its
# toolset_profile; each profile has its own token, and the gateway gives it exactly these tools,
# run on its server profile's instance. Agent profiles hold read tools only (AGENTS.md hard
# rule 2) and run on qradar-mcp-read. A write tool names its caller, the platform component
# that may call it; qradar-note-write is the Action Executor's.
#
# guard: aql runs the profile's AQL Guard rules on the query. only_own_searches limits the
# tool to Ariel searches started through the gateway in the same case or hunt, under the same
# profile; it is a layer on top of the fork's own ownership check (T-006). The gateway refuses
# to start if a profile lists an Ariel tool without them. max_rows caps the rows of one result
# (default: limits.max_rows).
profiles:
  qradar-triage-read:
    server_profile: qradar-read
    tools:
      - {id: get_offense, risk: read}
      - {id: list_offenses, risk: read}
      - {id: list_offense_types, risk: read}
      - {id: list_source_addresses, risk: read}
      - {id: list_local_destination_addresses, risk: read}
      - {id: list_rules, risk: read}
      - {id: get_rule, risk: read}
      - {id: list_assets, risk: read}
      - {id: list_log_sources, risk: read}
      - {id: get_log_source, risk: read}
      - {id: list_log_source_types, risk: read}
  qradar-investigate-read:
    server_profile: qradar-read
    # No list_rules, list_log_sources, list_log_source_types or list_offense_types: the agent
    # finds that catalog in its prompt (org_context), and their schemas cost tokens on every
    # request (decision T-52).
    tools:
      - {id: get_offense, risk: read}
      - {id: list_offenses, risk: read}
      - {id: list_source_addresses, risk: read}
      - {id: list_local_destination_addresses, risk: read}
      - {id: get_rule, risk: read}
      - {id: list_assets, risk: read}
      - {id: get_log_source, risk: read}
      - {id: create_ariel_search, risk: read, guard: aql}
      - {id: get_ariel_search_status, risk: read, only_own_searches: true}
      - {id: get_ariel_search_results, risk: read, max_rows: 500, only_own_searches: true}
      - {id: delete_ariel_search, risk: read, only_own_searches: true}
  qradar-verify-read:
    server_profile: qradar-read
    tools:
      - {id: create_ariel_search, risk: read, guard: aql}
      - {id: get_ariel_search_status, risk: read, only_own_searches: true}
      - {id: get_ariel_search_results, risk: read, max_rows: 200, only_own_searches: true}
      - {id: delete_ariel_search, risk: read, only_own_searches: true}
  qradar-hunt-read:
    server_profile: qradar-read
    tools:
      - {id: create_ariel_search, risk: read, guard: aql}
      - {id: get_ariel_search_status, risk: read, only_own_searches: true}
      - {id: get_ariel_search_results, risk: read, max_rows: 1000, only_own_searches: true}
      - {id: delete_ariel_search, risk: read, only_own_searches: true}
      - {id: list_reference_sets, risk: read}
      - {id: get_reference_set, risk: read}
      - {id: list_reference_maps, risk: read}
      - {id: get_reference_map, risk: read}
      - {id: list_reference_tables, risk: read}
      - {id: get_reference_table, risk: read}
  # The telemetry inventory (§11.4) and the Analysis Catalog sync (KnowledgeSync, §9, D-25):
  # rules, log sources and log source types, read page by page. No Ariel search. §11.2 also
  # lists custom properties and indexes; the fork has no tools for them yet. `list_offenses` is
  # for the health check "intake stopped" (T-032, T-68): QRadar's newest offense update.
  qradar-inventory-read:
    server_profile: qradar-read
    tools:
      - {id: list_offenses, risk: read}
      - {id: list_rules, risk: read}
      - {id: get_rule, risk: read}
      - {id: list_log_sources, risk: read}
      - {id: get_log_source, risk: read}
      - {id: list_log_source_types, risk: read}
  qradar-tuning-read:
    server_profile: qradar-read
    tools:
      - {id: list_rules, risk: read}
      - {id: get_rule, risk: read}
      - {id: create_ariel_search, risk: read, guard: aql}
      - {id: get_ariel_search_status, risk: read, only_own_searches: true}
      - {id: get_ariel_search_results, risk: read, max_rows: 500, only_own_searches: true}
      - {id: delete_ariel_search, risk: read, only_own_searches: true}
  # The Action Executor's profile (architecture §9, §11.2): add an offense note, and read the
  # offense's notes to skip a note that is already there. It is never given to an agent. Its
  # token is held only by the executor, and the gateway serves it only to runs of the pseudo
  # agent action-executor. The note text's limits are in config/policies/qradar.yaml.
  qradar-note-write:
    server_profile: qradar-note
    tools:
      - {id: add_offense_note, risk: write, caller: action-executor}
      - {id: get_offense_notes, risk: read, caller: action-executor}

# Quota pools (architecture §8.2, §11.3). A call with a case_id runs in the case pool, a call
# with only a hunt_id in the hunt pool. The pools share nothing, so a full hunt pool never
# delays a case call. Values are starting points until prod measurements (S-02).
#   concurrent_searches: Ariel searches open at once; one stays open from create until it is
#     deleted, reports a final status or is older than search_ttl_seconds.
#   requests_per_minute: calls to the MCP server in any 60 seconds.
#   max_wait_seconds: how long a call waits for room before it is denied.
#   allowed_hours, time_zone: new Ariel searches start only in this local time range.
quota_pools:
  case: {concurrent_searches: 3, requests_per_minute: 120, max_wait_seconds: 30, search_ttl_seconds: 900}
  hunt:
    concurrent_searches: 1
    requests_per_minute: 30
    allowed_hours: "20:00-07:00"
    time_zone: Europe/Istanbul
    max_wait_seconds: 60
    search_ttl_seconds: 3600

limits:
  # One MCP call, connection included. The gateway never retries a call.
  call_timeout_seconds: 60
  # Rows in one result unless the profile's tool entry sets max_rows.
  max_rows: 200
  # Rows are cut once their JSON exceeds this; the result is then marked truncated.
  max_result_bytes: 32768

# Tool input and output schemas: snapshots/ in the fork repository.
contract_tests: tests/lab/ in the fork repository
