# Model capability registry for prod (docs/architecture.md §8.4). One entry per model alias;
# the dev counterpart is registry.dev.yaml.
# All aliases currently describe DeepSeek V4 Flash (D-45). They remain separate so a future
# second model can be assigned without changing application code.
#
# - target: the model behind the alias in config/litellm/litellm.prod.yaml.
# - prod_equivalent: the same as target in prod.
# - capabilities: an agent whose manifest requires a capability missing here does not start
#   (fail closed, §8.4).
# - context_window: must equal vLLM's --max-model-len for the model. The values below are the
#   models' native context lengths.
# - forced_tool_choice: whether the model honours tool_choice "required". Pydantic AI sends
#   it for structured output; when false the agent sends "auto" instead (some OpenRouter
#   providers reject "required" in dev, registry.dev.yaml).
# - tool_parser, reasoning_parser: vLLM's --tool-call-parser and --reasoning-parser for the
#   model (§8.4). Values from the vLLM recipe and model card of each model. When the running
#   server uses other settings, change them here and rerun the model gate
#   (docs/agent-harness.md §5, B2).
# - turkish_quality: result of the harness Turkish suite (D-07); null until it is measured.
#
# Model release (T-24, architecture §19; ModelRelease in docs/impl/contracts.md). Every agent
# run records the release of its alias in agent_runs.model_release. A release that differs
# from the last one recorded for the alias is a new model release: the model gate runs again
# (docs/agent-harness.md §5, B2). The release is built from the entry:
# - alias is the key; target and tool_parser are the fields above; max_context is
#   context_window.
# - artifact: what vLLM serves (`vllm serve <artifact>`), as /v1/models reports it in `root`.
#   The values assume the server loads the Hugging Face repository its served model name names.
# - artifact_hash: the Hugging Face commit of the snapshot the server loads (the name of its
#   snapshots/<commit> directory), or sha256:<hex> of the weight files when they did not come
#   from a commit. Required in prod (contracts.md).
# - quantization: quant_method of quantization_config in the model's config.json, or vLLM's
#   --quantization; the dtype (e.g. bf16) when the model is not quantized.
# - tokenizer: "<name> sha256:<hex>", the hex being the sha256 of the model's tokenizer.json.
# - engine_version: the vLLM version, as /version reports it.
# - inference_params: sampling parameters (temperature, top_p, ...) set for the alias. Neither
#   the platform nor LiteLLM sets any, so vLLM applies the model's generation_config.json; a
#   server-side override (--override-generation-config) is recorded here. The release's
#   inference_params also hold the request settings above (parallel_tool_calls when not null,
#   forced_tool_choice) and reasoning_parser when not null.
#
# The prod servers cannot be reached from dev, so the values below that only the servers can
# give are null until the deployment reads them there. At deployment,
# `uv run python -m ais0c_worker.model_release verify` compares artifact, max_context and
# engine_version with the servers and reports a missing artifact_hash; quantization, tokenizer,
# the parsers and inference_params are read on the server by hand.
#
# Checks: tests/deploy/test_model_registry.py and packages/activities/tests/test_model_release.py.

soc-fast:
  target: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash
  prod_equivalent: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash
  capabilities: [tool_calling, structured_output]
  parallel_tool_calls: false
  forced_tool_choice: true
  context_window: 1048576
  tool_parser: deepseek_v4
  reasoning_parser: deepseek_v4
  turkish_quality: null
  artifact: deepseek-ai/DeepSeek-V4-Flash
  artifact_hash: null  # not read yet: only the prod server's model files give it
  quantization: null  # not read yet: vLLM's API does not report it; read on the prod server
  tokenizer: null  # not read yet: vLLM's API does not report it; read on the prod server
  engine_version: null  # not read yet: the prod server is not reachable from dev
  inference_params: {}

