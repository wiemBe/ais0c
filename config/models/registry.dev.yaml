# Model capability registry for dev and lab (docs/architecture.md §8.4). One entry per model
# alias; the prod counterpart is registry.prod.yaml.
#
# - target: the model behind the alias in config/litellm/litellm.dev.yaml.
# - prod_equivalent: the alias's target in registry.prod.yaml. Dev runs the prod models
#   through OpenRouter (D-12).
# - capabilities: an agent whose manifest requires a capability missing here does not start
#   (fail closed, §8.4).
# - context_window: tokens the model accepts through OpenRouter.
# - tool_parser, reasoning_parser: vLLM settings (§8.4). Null in dev: the OpenRouter provider
#   serving the request decides.
# - turkish_quality: result of the harness Turkish suite (D-07); null until it is measured.
#
# Checks: tests/deploy/test_model_registry.py.

soc-fast:
  target: openrouter/deepseek/deepseek-v4-flash
  prod_equivalent: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash
  capabilities: [tool_calling, structured_output]
  parallel_tool_calls: false
  context_window: 1048576
  tool_parser: null
  reasoning_parser: null
  turkish_quality: null

