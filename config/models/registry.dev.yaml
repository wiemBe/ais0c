# Model capability registry for dev and lab (docs/architecture.md §8.4). One entry per model
# alias; the prod counterpart is registry.prod.yaml.
#
# - target: the model behind the alias in config/litellm/litellm.dev.yaml.
# - prod_equivalent: the alias's target in registry.prod.yaml. Dev runs the prod models
#   through OpenRouter (D-12), except aliases on a free dev model (D-39): soc-reasoning
#   and soc-report run openrouter/stealth/space-bunny-alpha. soc-verifier stays
#   on Qwen so it differs from soc-reasoning (D-21).
# - capabilities: an agent whose manifest requires a capability missing here does not start
#   (fail closed, §8.4).
# - context_window: tokens the model accepts through OpenRouter.
# - parallel_tool_calls: null when the model rejects the parameter; it is then not sent
#   (Space Bunny Alpha has no OpenRouter endpoint that accepts it, D-39).
# - forced_tool_choice: whether the model honours tool_choice "required". Pydantic AI sends
#   it for structured output; when false the agent sends "auto" instead (Space Bunny Alpha
#   rejects "required" through OpenRouter, D-39).
# - tool_parser, reasoning_parser: vLLM settings (§8.4). Null in dev: the OpenRouter provider
#   serving the request decides.
# - turkish_quality: result of the harness Turkish suite (D-07); null until it is measured.
#
# Model release (T-24, architecture §19; ModelRelease in docs/impl/contracts.md). Every agent
# run records the release of its alias in agent_runs.model_release. A release that differs
# from the last one recorded for the alias is a new model release: the model gate runs again
# (docs/agent-harness.md §5, B2). The release is built from the entry:
# - alias is the key; target and tool_parser are the fields above; max_context is
#   context_window.
# - artifact: the model ID OpenRouter serves. OpenRouter does not show which weights, engine
#   or settings its provider runs, so the fields after it are null in dev.
# - inference_params: sampling parameters (temperature, top_p, ...) set for the alias. Neither
#   the platform nor LiteLLM sets any; the provider's defaults apply. The release's
#   inference_params also hold the request settings above (parallel_tool_calls when not null,
#   forced_tool_choice) and reasoning_parser when not null.
#
# Checks: tests/deploy/test_model_registry.py and packages/activities/tests/test_model_release.py.

soc-fast:
  target: openrouter/deepseek/deepseek-v4-flash
  prod_equivalent: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash
  capabilities: [tool_calling, structured_output]
  parallel_tool_calls: null
  forced_tool_choice: true
  context_window: 1048576
  tool_parser: null  # chosen by the OpenRouter provider; not visible
  reasoning_parser: null  # chosen by the OpenRouter provider; not visible
  turkish_quality: null
  artifact: deepseek/deepseek-v4-flash
  artifact_hash: null  # OpenRouter does not show which weights the provider runs
  quantization: null  # varies with the provider OpenRouter picks for each request
  tokenizer: null  # the provider's tokenizer files are not visible through OpenRouter
  engine_version: null  # the provider's inference engine is not visible through OpenRouter
  inference_params: {}

soc-reasoning:
  target: openrouter/stealth/space-bunny-alpha
  prod_equivalent: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash
  capabilities: [tool_calling, structured_output]
  parallel_tool_calls: null
  forced_tool_choice: false
  context_window: 1000000
  tool_parser: null  # chosen by the OpenRouter provider; not visible
  reasoning_parser: null  # chosen by the OpenRouter provider; not visible
  turkish_quality: null
  artifact: stealth/space-bunny-alpha
  artifact_hash: null  # OpenRouter does not show which weights the provider runs
  quantization: null  # set by the provider; not visible for a stealth model
  tokenizer: null  # the provider's tokenizer files are not visible through OpenRouter
  engine_version: null  # the provider's inference engine is not visible through OpenRouter
  inference_params: {}

