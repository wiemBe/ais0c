[project]
name = "ais0c-querylang"
version = "0.1.0"
description = "Sigma to AQL/CQL compilation and AQL helpers."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    # Validates the field mapping pipeline file (config/sigma/).
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    # IBM's Sigma to AQL backend (architecture §14, T-06). Its processing items are reused
    # by ais0c_querylang.sigma_compiler, so a new minor version must be reviewed first.
    "pysigma-backend-qradar-aql>=0.3.2,<0.4",
    "pysigma>=0.11.23,<0.12",
    # pySigma 0.11 fails to parse rule conditions with pyparsing 3.3.
    "pyparsing>=3.1,<3.3",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
