# Alembic settings for the application database (docs/impl/data-model.md).
#
#   cd packages/storage && uv run alembic upgrade head
#
# The database URL is read from AIS0C_DATABASE_URL by migrations/env.py. There is deliberately
# no sqlalchemy.url here: nothing in the repository holds connection settings.
#
# Revisions are numbered; a new one takes the next number:
#   uv run alembic revision --rev-id 0002 -m "add knowledge_chunks"

[alembic]
script_location = %(here)s/src/ais0c_storage/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
