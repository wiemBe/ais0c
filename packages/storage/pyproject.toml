[project]
name = "ais0c-storage"
version = "0.1.0"
description = "PostgreSQL tables, repository functions and Alembic migrations."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.12,<3",
    "sqlalchemy[asyncio]>=2.1.2,<2.2",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
