[project]
name = "ais0c-activities"
version = "0.1.0"
description = "Temporal activities that run agents and deterministic jobs."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    "ais0c-storage",
    "ais0c-knowledge",
    "ais0c-querylang",
    "ais0c-policy",
    "ais0c-agents",
    "ais0c-executor",
    # Two read queries of the intake; same range as ais0c-storage.
    "sqlalchemy[asyncio]>=2.1.2,<2.2",
    # Activity definitions and the client that starts case workflows.
    "temporalio[pydantic]>=1.34,<2",
    # TemporalDurability for the Triage agent (decision T-02); same range as ais0c-agents.
    "pydantic-ai-slim[temporal]>=2.53,<3",
    # Run records and gateway results; same range as ais0c-contracts.
    "pydantic>=2.12,<3",
    # The model registry's model releases, recorded with each agent run (T-016).
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
