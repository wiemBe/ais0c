[project]
name = "ais0c-workflows"
version = "0.1.0"
description = "Deterministic Temporal workflows."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    # Workflow state models (checkpoint, case view); same range as ais0c-contracts.
    "pydantic>=2.12,<3",
    # Workflow engine (decision T-01); the extra brings the Pydantic data converter.
    "temporalio[pydantic]>=1.34,<2",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
