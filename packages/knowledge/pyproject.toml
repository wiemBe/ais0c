[project]
name = "ais0c-knowledge"
version = "0.1.0"
description = "ATT&CK and CTI ingestion, hunt pack validation, Analysis Catalog sync and skills."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    "ais0c-storage",
    "ais0c-querylang",
    # Skill manifest models (skills/) and QRadar inventory rows; same version range as
    # ais0c-contracts.
    "pydantic>=2.12,<3",
    # Skill manifests (skills/<id>/<version>/skill.yaml) are YAML.
    "pyyaml>=6.0.3,<7",
    # The catalog sync's advisory lock; same range as ais0c-storage.
    "sqlalchemy[asyncio]>=2.1.2,<2.2",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
