# Scenario s4-kerberoasting.
name: "AIS0C LAB - Kerberoasting RC4 service tickets"
scenario: s4-kerberoasting
description: >-
  One account requests RC4 (0x17) service tickets in a burst: at least 5 in 2 minutes
  (T1558.003). The service name is not a field the rule engine can count on.
index_by: username
conditions:
  - test: log_source_type
    value: Microsoft Windows Security Event Log
  - test: qid
    value: 5000938
    meaning: 4769, "A Kerberos service ticket was granted" (measured on the lab, T-058)
  - test: payload_contains
    value: "Ticket Encryption Type: 0x17"
  - test: username_not_matches
    value: ['\$$']
  - test: threshold
    events: 5
    window_minutes: 2
    same: username
