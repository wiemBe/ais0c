# Scenario s5-password-spraying.
name: "AIS0C LAB - Password spraying from one source"
scenario: s5-password-spraying
description: >-
  Failed logons (4625) and Kerberos pre-authentication failures (4771) from one source
  address against many different accounts (T1110.003).
index_by: source_ip
conditions:
  - test: log_source_type
    value: Microsoft Windows Security Event Log
  # 4625 ("An account failed to log on") and 4771 ("Kerberos pre-authentication failed",
  # QID 5000940, measured on the lab, T-058).
  - test: payload_contains_any
    value:
      - An account failed to log on
      - Kerberos pre-authentication failed
  - test: threshold
    events: 10
    window_seconds: 300
    same: source_ip
    distinct: username
    distinct_count: 5
