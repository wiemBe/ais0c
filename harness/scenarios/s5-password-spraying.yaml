# s5-password-spraying: one source tries a few passwords against many accounts
# (T1110.003) and gets in once.
#
# Expected decision: tp. Rationale: a single address produces 24 failed logons (4625)
# and 12 Kerberos pre-authentication failures (4771) across twelve different accounts
# in about three minutes, then one successful logon (4624) from the same address.
# Few attempts per account, many accounts, one source: spraying, not typos. The
# successful logon makes it an active compromise. QRadar opens one offense indexed by
# the source address (T-027's grouping applies when several offenses open).
#
# The baseline holds ordinary logons and two stray typos of one user from his usual
# workstation.
name: s5-password-spraying
description: Many accounts fail to log on from one source, then one logon succeeds.

steps:
  - id: windows-logon-background
    malicious: false
    events:
      - kind: windows_logon
        count: 12
        spread: 3600
        params:
          event_id: "4624"
          logon_type: "3"
          users: [analyst1, helpdesk1, branch.user02]
          hosts: [DC-LAB-01, FILE-SRV-01]

  - id: benign-typos
    malicious: false
    events:
      - kind: windows_logon
        count: 2
        spread: 3600
        params:
          event_id: "4625"
          logon_type: "3"
          users: [analyst1]
          hosts: [DC-LAB-01]

  - id: spray-failed-logons
    malicious: true
    technique: T1110.003
    events:
      - kind: windows_logon
        count: 24
        start: 2400
        interval: 5
        params:
          event_id: "4625"
          logon_type: "3"
          users:
            - branch.user01
            - branch.user02
            - branch.user03
            - branch.user04
            - branch.user05
            - branch.user06
            - branch.user07
            - branch.user08
            - branch.user09
            - branch.user10
            - branch.user11
            - branch.user12
          hosts: [DC-LAB-01]
          src_pool: [10.50.7.23]

  - id: spray-kerberos-preauth-failures
    malicious: true
    technique: T1110.003
    events:
      - kind: windows_logon
        count: 12
        start: 2410
        interval: 10
        params:
          event_id: "4771"
          users:
            - branch.user01
            - branch.user02
            - branch.user03
            - branch.user04
            - branch.user05
            - branch.user06
            - branch.user07
            - branch.user08
            - branch.user09
            - branch.user10
            - branch.user11
            - branch.user12
          hosts: [DC-LAB-01]
          src_pool: [10.50.7.23]

  - id: spray-success
    malicious: true
    technique: T1078
    events:
      - kind: windows_logon
        count: 1
        start: 2650
        params:
          event_id: "4624"
          logon_type: "3"
          users: [branch.user07]
          hosts: [DC-LAB-01]
          src_pool: [10.50.7.23]
