  claims:
  - text: Rule 100353 (AIS0C LAB - DCSync by a non-machine account) is a user-created EVENT rule that
      detects domain replication (DCSync) operations performed by accounts without a trailing $ (non-machine
      accounts).
    evidence_ids:
    - ev_01a1114ae3f872049fa7a63fa03d22ef
    - ev_01a1114b4f0d77bab4eb6c8ab53d8274
  - text: Offense 33 was triggered by the svc_backup account on Domain Controller DC-LAB-01 (log source
      213, Microsoft Windows Security Event Log) for a DCSync-like replication operation.
    evidence_ids:
    - ev_01a1114b4f0d77bab4eb6c8ab53d8274
    - ev_01a1114ae3d77eed86c24b92ba2f5811
    - ev_01a1114b193a7d628a35666aba5738b3
  - text: All three IPs (198.51.100.101, 198.51.100.72, 198.51.100.58) appear together in 8 prior offenses
      (IDs 18, 21, 25, 27, 28, 30, 31, 32) plus current offense 33, all triggered by the same rule 100353
      with the same svc_backup account, indicating recurring activity.
    evidence_ids:
    - ev_01a1114eb08579a3ac0eb0852641c9ee
    - ev_01a1114eef34738db1efa72b5ea881cd
  - text: 'Prior offenses show a consistent pattern: all involve svc_backup, rule 100353, DC-LAB-01, exactly
      3 events each, same description ''Success Audit: An operation was performed on an object'', with
      magnitude increasing from 1 to 3 over time.'
    evidence_ids:
    - ev_01a1114eef34738db1efa72b5ea881cd
  - text: Raw Windows Event Log payloads (Event ID 4662) could not be retrieved via AQL queries, leaving
      the exact replication operation type (DS-Replication-Get-Changes/All) and target objects unconfirmed.
    evidence_ids:
    - ev_01a1114eb08579a3ac0eb0852641c9ee
    - ev_01a1114d2e5f7a61862828547f046411
    - ev_01a1114d96d376d78b84584f89ef7740
    - ev_01a1114e119c7a13bf25546205843b2f
  - text: Asset model contains no hostname or role information for any of the three involved IPs (198.51.100.101,
      198.51.100.72, 198.51.100.58), preventing identification of the originating host.
    evidence_ids:
    - ev_01a1114eb08579a3ac0eb0852641c9ee
  - text: The rule name includes 'LAB', suggesting it was created for a lab/SOC training environment scenario,
      but it is enabled and actively generating offenses with escalating magnitude.
    evidence_ids:
    - ev_01a1114ae3f872049fa7a63fa03d22ef
