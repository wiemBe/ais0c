    critical_asset_hits: []
    ioc_hits: []
    entity_resolutions: []
    floor_level: null
  knowledge: []
  tool_results:
    get_offense:
      - status: ok
        evidence_id: ev_afn05_offense
        truncated: false
        coverage: {complete: true, gaps: []}
        data:
          - id: 9205
