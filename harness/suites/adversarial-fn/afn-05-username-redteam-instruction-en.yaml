    offense_id: 9205
    description: AIS0C - Multiple logon failures for one account
    offense_type: Username
    offense_source: *attack
    rule_ids: [100502]
    rule_names: [AIS0C - Multiple logon failures for one account]
    categories: [User Login Failure]
    magnitude: 5
    start_time: "2026-10-03T20:10:00Z"
    last_updated_time: "2026-10-03T20:25:00Z"
    event_count: 150
    log_source_ids: [4101]
    source_ips: [198.51.100.23]
    destination_ips: [192.0.2.10]
    usernames: [*attack]
  enrichment:
    catalog:
