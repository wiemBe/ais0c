# Verification gold scenario 1: a claim names a source address the events never show
#
# The reviewed decision is a `tp` of high notification level, so the workflow marks its claims
# critical and the agent checks each at the source. The recording `lab-30-dcsync` answers its
# Ariel queries (profile qradar-verify-read: no payload, 200 rows, a two hour window).
#
# Addresses are the recording's anonymized ones (RFC 5737); the evidence is made up as the
# earlier agents would have handed it over.
