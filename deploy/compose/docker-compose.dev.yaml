# Development stack: Temporal, PostgreSQL + pgvector, LiteLLM, the OpenTelemetry collector and
# the Mailpit e-mail catcher (docs/architecture.md §4, §25; T-11). How to run it:
# deploy/compose/README.md.
#
#   docker compose -f deploy/compose/docker-compose.dev.yaml up -d --wait
#
# The compose profile "qradar" adds the MCP Policy Gateway and the two qradar-mcp instances
# (T-018). They need a QRadar console and the secret files in deploy/compose/secrets/; the lab
# QRadar also needs the override docker-compose.lab.yaml (README, "QRadar ve gateway").
#
# - Images are pinned by tag and digest: a tag can be moved, a digest cannot. Images built on
#   this machine are the exception: they are never pulled (pull_policy), and the gateway's
#   Dockerfile pins its own base images.
# - Secrets come only from the environment, usually deploy/compose/.env (git-ignored; template:
#   .env.example), or from secret files mounted in /run/secrets. Compose stops with a message
#   when a required one is missing.
# - Ports are published on 127.0.0.1 only; Temporal has no authentication in this setup.
# - Bind mounts are read-only and carry the SELinux label "z" for Fedora and RHEL hosts.
#
# Checks: tests/deploy/test_compose_file.py (static), tests/deploy/test_dev_stack.py (against
# the running stack) and, for the "qradar" profile, services/mcp-gateway/tests/test_deploy.py.

name: ais0c-dev

# What the two qradar-mcp instances share. The image is the fork (T-006) built on this machine
# from the commit in config/connectors/qradar.yaml (server_version), tagged with that commit; it
# is never pulled (README, "Fork imajı").
x-qradar-mcp: &qradar-mcp
  profiles: [qradar]
  image: qradar-mcp-fork:7dcf3ce72062978e74975c7bca4f77e21d383a68
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # The fork exits when it cannot reach QRadar at startup; it starts again until it can.
  restart: unless-stopped

services:
  # Application data, knowledge store and Temporal's databases, in separate databases (§25).
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
      # Read by postgres/init/10-databases.sh on the first start.
      AIS0C_DB_PASSWORD: ${AIS0C_DB_PASSWORD:?Set AIS0C_DB_PASSWORD in deploy/compose/.env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in deploy/compose/.env}
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP rather than the Unix socket: during the first start the init scripts run against a
      # temporary server that listens only on the socket.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot job: creates or upgrades Temporal's tables, then exits.
  temporal-schema:
    image: docker.io/temporalio/admin-tools:1.31.3@sha256:76a70ead160808b54acdbc98944dfc07990d9637dda999118a2d9ee1f58b9bc9
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: temporal
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in deploy/compose/.env}
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro,z
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    restart: "no"

  temporal:
    image: docker.io/temporalio/server:1.31.3@sha256:b4a78d2186e558aa3502be08d576086c3a82fccdf6184cb4c819eb27bea7bd63
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in deploy/compose/.env}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro,z
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      # The frontend's HTTP API (port 7243, not published) answers only once it serves requests;
      # an open gRPC port alone does not prove that.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7243/api/v1/cluster-info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Registers the default namespace and stays up for the Temporal CLI:
  #   docker compose -f deploy/compose/docker-compose.dev.yaml exec temporal-admin-tools temporal workflow list
  temporal-admin-tools:
    image: docker.io/temporalio/admin-tools:1.31.3@sha256:76a70ead160808b54acdbc98944dfc07990d9637dda999118a2d9ee1f58b9bc9
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro,z
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    healthcheck:
      # Healthy once the namespace that workers and clients use exists.
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: docker.io/temporalio/ui:2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5
    depends_on:
      temporal-admin-tools:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Model gateway (§19). Dev routes every alias to OpenRouter: config/litellm/litellm.dev.yaml.
  # AIS0C_LITELLM_CONFIG=litellm.dev-free.yaml switches to the free OpenCode Zen model (T-104).
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in deploy/compose/.env}
      # Optional: without it the proxy starts, but model calls fail.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Key for litellm.dev-free.yaml; the free tier accepts "public".
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      # Use the model cost map bundled in the image instead of downloading it at startup.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ../../config/litellm/${AIS0C_LITELLM_CONFIG:-litellm.dev.yaml}:/etc/litellm/config.yaml:ro,z
    ports:
      - "127.0.0.1:4000:4000"
    # The image runs as root by default; the proxy needs neither root nor a writable image.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro,z
      # The collector image holds only the collector binary: no shell, no HTTP client. The
      # healthcheck runs a statically linked busybox from this pinned image, mounted read-only.
      - type: image
        source: docker.io/library/busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
        target: /probe
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    healthcheck:
      test: ["CMD", "/probe/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Catches the executor's alert e-mails (T-020): it takes every e-mail sent to 127.0.0.1:1025
  # (SMTP, no TLS: AIS0C_SMTP_TLS=none) and shows it at http://127.0.0.1:8025, in its web UI and
  # its API. It sends nothing on.
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      # No update check over the internet, no reverse DNS lookup of SMTP clients.
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      # The web UI and the API answer only to these Host headers (DNS rebinding).
      MP_ALLOWED_HOSTS: "127.0.0.1:8025,localhost:8025"
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
    # The image runs as root by default; Mailpit needs neither root nor a writable image. The
    # e-mails live in a temporary database in /tmp and are gone when the container stops.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # --- profile "qradar": QRadar through the MCP Policy Gateway (§11.2, §13.4, §25; T-018) ----

  # The only way to QRadar: agents and the Action Executor call it with their profile's token.
  # Workers on the host reach it at http://127.0.0.1:8090.
  mcp-gateway:
    profiles: [qradar]
    image: ais0c-mcp-gateway:dev
    build:
      context: ../..
      dockerfile: services/mcp-gateway/Dockerfile
    # Built from this checkout on every `up`; an image of this name is never pulled.
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The application database; its schema comes from packages/storage's migrations.
      AIS0C_DATABASE_URL: postgresql+psycopg://ais0c:${AIS0C_DB_PASSWORD:?Set AIS0C_DB_PASSWORD in deploy/compose/.env}@postgres:5432/ais0c
      AIS0C_GATEWAY_CONFIG_DIR: /etc/ais0c
      AIS0C_GATEWAY_UPSTREAM_URL_QRADAR_MCP_READ: http://qradar-mcp-read.mcp:5000/mcp
      AIS0C_GATEWAY_UPSTREAM_URL_QRADAR_MCP_NOTE: http://qradar-mcp-note.mcp:5000/mcp
    # In /run/secrets: one token per gateway profile, and the gateway's token towards each MCP
    # instance. No QRadar token: those stay in the MCP instances (§13.4).
    secrets:
      - gateway-token-qradar-triage-read
      - gateway-token-qradar-investigate-read
      - gateway-token-qradar-verify-read
      - gateway-token-qradar-hunt-read
      - gateway-token-qradar-inventory-read
      - gateway-token-qradar-tuning-read
      - gateway-token-qradar-note-write
      - mcp-token-qradar-mcp-read
      - mcp-token-qradar-mcp-note
    volumes:
      - ../../config/connectors:/etc/ais0c/connectors:ro,z
      - ../../config/policies:/etc/ais0c/policies:ro,z
    ports:
      - "127.0.0.1:8090:8080"
    networks: [default, mcp]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys, urllib.request; sys.exit(urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=3).status != 200)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The qradar-mcp fork (T-006): one instance per fork --profile, each with its own QRadar
  # token. qradar-mcp-read's token can only read; qradar-mcp-note's can add notes, and only the
  # note tools are registered on it.
  qradar-mcp-read:
    <<: *qradar-mcp
    # --host binds the server to its name on the mcp network (the image listens on 0.0.0.0), so
    # it accepts no connection from any other network, the lab's macvlan included.
    command: ["--profile", "qradar-read", "--host", "qradar-mcp-read.mcp"]
    environment:
      QRADAR_CONSOLE_FQDN: ${QRADAR_CONSOLE_FQDN:-}
      QRADAR_VERIFY_SSL: ${QRADAR_VERIFY_SSL:-true}
      QRADAR_AUTH_TOKEN_FILE: /run/secrets/qradar-token-read
      MCP_AUTH_TOKEN_FILE: /run/secrets/mcp-token-qradar-mcp-read
    secrets: [qradar-token-read, mcp-token-qradar-mcp-read]
    networks:
      mcp:
        aliases: [qradar-mcp-read.mcp]
      qradar-egress: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys, urllib.request; sys.exit(urllib.request.urlopen("http://qradar-mcp-read.mcp:5000/healthz", timeout=3).status != 200)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  qradar-mcp-note:
    <<: *qradar-mcp
    command: ["--profile", "qradar-note", "--host", "qradar-mcp-note.mcp"]
    environment:
      QRADAR_CONSOLE_FQDN: ${QRADAR_CONSOLE_FQDN:-}
      QRADAR_VERIFY_SSL: ${QRADAR_VERIFY_SSL:-true}
      QRADAR_AUTH_TOKEN_FILE: /run/secrets/qradar-token-note
      MCP_AUTH_TOKEN_FILE: /run/secrets/mcp-token-qradar-mcp-note
    secrets: [qradar-token-note, mcp-token-qradar-mcp-note]
    networks:
      mcp:
        aliases: [qradar-mcp-note.mcp]
      qradar-egress: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys, urllib.request; sys.exit(urllib.request.urlopen("http://qradar-mcp-note.mcp:5000/healthz", timeout=3).status != 200)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  # The gateway's south side (§13.4): the gateway and the MCP instances and nothing else, so only
  # the gateway reaches the MCP servers. Internal: nothing on it has a route out.
  mcp:
    internal: true
  # The MCP instances' way to QRadar; no other service is on it. On the lab machine this bridge
  # cannot reach the lab QRadar, so docker-compose.lab.yaml adds qradar-vmnet.
  qradar-egress: {}

# Secret files, made by make_secrets.py (README, "QRadar ve gateway"). Each is mounted only into
# the services that hold it: the gateway's profile tokens are held, outside Compose, by the
# workers (agents/) and by the Action Executor alone (executor/).
secrets:
  gateway-token-qradar-triage-read:
    file: ./secrets/agents/gateway-token-qradar-triage-read
  gateway-token-qradar-investigate-read:
    file: ./secrets/agents/gateway-token-qradar-investigate-read
  gateway-token-qradar-verify-read:
    file: ./secrets/agents/gateway-token-qradar-verify-read
  gateway-token-qradar-hunt-read:
    file: ./secrets/agents/gateway-token-qradar-hunt-read
  gateway-token-qradar-inventory-read:
    file: ./secrets/agents/gateway-token-qradar-inventory-read
  gateway-token-qradar-tuning-read:
    file: ./secrets/agents/gateway-token-qradar-tuning-read
  gateway-token-qradar-note-write:
    file: ./secrets/executor/gateway-token-qradar-note-write
  mcp-token-qradar-mcp-read:
    file: ./secrets/mcp/mcp-token-qradar-mcp-read
  mcp-token-qradar-mcp-note:
    file: ./secrets/mcp/mcp-token-qradar-mcp-note
  qradar-token-read:
    file: ./secrets/qradar/qradar-token-read
  qradar-token-note:
    file: ./secrets/qradar/qradar-token-note

volumes:
  postgres-data:
