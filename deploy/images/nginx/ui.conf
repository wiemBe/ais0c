# nginx of the ais0c-ui image (T-076). TLS ends here; plain HTTP is not served.
server_tokens off;

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /run/secrets/ui-tls.crt;
    ssl_certificate_key /run/secrets/ui-tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # The analyst API; "api" is the service name in the compose file (T-077).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths go to index.html.
    location / {
        try_files $uri /index.html;
    }
}
