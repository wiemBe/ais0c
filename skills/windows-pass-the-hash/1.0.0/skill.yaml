# Pass-the-hash: an NTLM hash used as a credential. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-pass-the-hash
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Pass-the-hash: an attacker who holds the NTLM hash of an account's password authenticates as that account without knowing the password."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1550.002]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4624 network logons (type 3) of privileged accounts whose authentication package is NTLM, with the source address"
      - "4776 NTLM credential validation on domain controllers, with the account and the workstation"
    required: true
  - telemetry_class: windows
    events:
      - "4768 TGT requests of the same accounts in the same window, to show whether Kerberos was used at all"
      - "5140 and 5145 administrative share access that followed the logons"
    required: false
required_evidence:
  - id: ntlm-spread
    description: "The NTLM logons of the account in the window: hosts, sources, times, and how many hosts in how short a time"
  - id: kerberos-absence
    description: "Whether the account used Kerberos (4768) in the same window at all"
  - id: baseline-fit
    description: "The account's normal authentication: hosts, sources and protocols, from history or the organization context"
  - id: followup
    description: "What the logons did: administrative share access, service installs or remote execution on the hosts reached"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-pass-the-hash, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
