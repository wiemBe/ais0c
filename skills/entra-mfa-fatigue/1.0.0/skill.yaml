# Multi-factor authentication fatigue. A draft; its lab scenario is not written
# yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: entra-mfa-fatigue
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1621, T1621.001]
required_telemetry:
  - log_source_type: Microsoft Entra ID Sign-in Log
    events:
      - "Cloud sign-in log: the account's authentication attempts with second-factor prompt outcomes - denied storms, approvals, times and the requesting addresses"
    required: true
  - log_source_type: Microsoft Entra ID Sign-in Log
    events:
      - "The approved session's activity afterwards"
    required: false
  - log_source_type: E-mail Security Appliance
    events:
      - "Mailbox activity from the approved session, where the gateway sees it"
    required: false
required_evidence:
  - id: prompt-storm
    description: "The denied prompts: count, interval, duration, and the address driving them"
  - id: the-approval
    description: "The one approval: when, from which prompt, after how much flooding"
  - id: password-origin
    description: "How the attacker held the password: stuffing, phishing, dumps (the other skills' shapes)"
  - id: session-use
    description: "What the approved session did: mail rules, consents, data access, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-entra-mfa-fatigue, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
