# Windows DCSync investigation. A draft built on the lab's s2-dcsync scenario (T-008): approval
# sets status, approved_by and content_hash (skills/README.md).
id: windows-dcsync
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1003.006]
required_telemetry:
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4662 on domain controllers: an operation on the domain object with a DS-Replication control access right in Properties"
    required: true
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4624 on domain controllers: network logons (type 3) of the replicating account, with the source address"
    required: false
required_evidence:
  - id: replication-events
    description: "The 4662 events with a DS-Replication right: time, domain controller and subject account"
  - id: account-classification
    description: "Whether the subject account is a domain controller machine account, an approved directory sync account or neither"
  - id: request-source
    description: "Where the request came from: the source address of the account's logon on the domain controller"
  - id: account-scope
    description: "Other domain controllers, other times and other accounts in the window that show the same replication"
# Starting values; the skill's suite (T-030) measures them. One Ariel search takes at least four
# tool calls (create, status, results, delete); critical and high offenses have a 10 minute SLA.
budgets:
  tokens: 120000
  tool_calls: 24
  wall_clock_seconds: 300
output_schema: InvestigationResult
eval_suites: [skill-windows-dcsync, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
