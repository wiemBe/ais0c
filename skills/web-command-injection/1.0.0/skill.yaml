# Command injection against a web application behind the WAF. A draft; its lab scenario is
# not written yet (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: web-command-injection
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  # T1190 is shared by several web skills: the router offers them all, the orchestrator
  # connects the one whose Purpose names this WAF attack type.
  attack_techniques: [T1190]
required_telemetry:
  - telemetry_class: waf
    events:
      - "Request log with attack_type Command Execution: sig_names, request_status, response_code, ip_client, uri, query_string and user_agent"
    required: true
  - telemetry_class: firewall
    events:
      - "Traffic from the web server: outbound connections to external addresses and their volume, the strongest sign that a command ran"
    required: false
  - telemetry_class: windows
    events:
      - "Events of the web server host after the requests: new services (7045) and processes, when the host reports to QRadar"
    required: false
required_evidence:
  - id: request-summary
    description: "Per source address: request count, signature families, request_status values and response codes"
  - id: reached-application
    description: "Whether any command injection request was passed on (alerted) and answered by the application"
  - id: host-followup
    description: "What the web server host did after answered requests: outbound connections, new processes or services, or a data gap"
  - id: source-scope
    description: "Other requests and attack families from the same source"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-command-injection, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
