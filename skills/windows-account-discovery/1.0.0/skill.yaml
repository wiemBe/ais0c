# Account and permission discovery. A draft; its lab scenario is not written yet
# (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-account-discovery
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Account and permission discovery: someone is enumerating users, groups and privileges to pick the next target."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1069, T1069.002, T1087, T1087.002]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4688 process creation with enumeration argument shapes: account and group listing commands, directory-module account queries, trust listings, and privilege display commands, with the subject and host"
    required: true
  - telemetry_class: windows
    events:
      - "4104 script blocks of enumeration scripts, where PowerShell logging reaches QRadar"
    required: false
required_evidence:
  - id: enumeration-events
    description: "The enumeration commands: tool, arguments, subject, host and time"
  - id: density-and-scope
    description: "How many commands in how short a window, and how wide the questions reached: one group or the domain"
  - id: subject-role
    description: "Who enumerated: an administrator, an inventory agent, or an account with no reason to ask"
  - id: what-followed
    description: "The accounts or groups that were touched afterwards: logons, changes, attacks"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-account-discovery, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
