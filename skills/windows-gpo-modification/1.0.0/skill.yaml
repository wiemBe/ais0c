# Group Policy modification. A draft; its lab scenario is not written yet (T-060):
# approval sets status, approved_by and content_hash (skills/README.md).
id: windows-gpo-modification
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1484.001]
required_telemetry:
  - telemetry_class: windows
    events:
      - "5136, 5137 and 5141 on domain controllers: group policy objects under the policies container modified, created or deleted, with the subject and the changed attribute"
    required: true
  - telemetry_class: windows
    events:
      - "4698 scheduled task creations and 4688 script executions across the fleet after the policy change"
    required: false
required_evidence:
  - id: policy-change
    description: "The directory events: which policy object, which attribute, subject and time"
  - id: subject-role
    description: "Who changed it: the account's role and host, and whether policy administration is its job"
  - id: scope-and-effect
    description: "Which hosts the policy reaches, and what the changed settings make them do"
  - id: fleet-followup
    description: "What appeared on those hosts after the change: tasks, scripts, settings, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-gpo-modification, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
