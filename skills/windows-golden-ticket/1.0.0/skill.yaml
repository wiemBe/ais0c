# Forged Kerberos ticket use (golden ticket). A draft; its lab scenario is not written yet
# (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-golden-ticket
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1558.001]
required_telemetry:
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4769 on domain controllers: service ticket requests whose Service Name is krbtgt, which no legitimate client requests"
      - "4768 on domain controllers: TGT requests, to compare against the sessions that used none"
    required: true
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4624 logons of the accounts the forged tickets were used for"
    required: false
required_evidence:
  - id: krbtgt-requests
    description: "Any 4769 event whose Service Name is krbtgt, with the requesting account and client address"
  - id: tgt-gap
    description: "Sessions whose service ticket requests had no matching 4768 TGT request from the same client"
  - id: encryption-anomaly
    description: "Service tickets for privileged accounts issued as RC4 (0x17) where history shows AES256 (0x12)"
  - id: account-use
    description: "The accounts' logons in the window, above all on domain controllers and critical assets"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-golden-ticket, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
