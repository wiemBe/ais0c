# Deserialization attacks behind the WAF. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: web-deserialization
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1190]
required_telemetry:
  - telemetry_class: waf
    events:
      - "Request log: serialized-object and gadget signature families in sig_names, with request_status, response_code, ip_client, uri and the parameter shapes in query_string"
    required: true
  - telemetry_class: firewall
    events:
      - "Outbound traffic from the web server after answered requests, and any new processes or services on the host where its events reach QRadar"
    required: false
required_evidence:
  - id: request-summary
    description: "Per source: the serialized-object signature requests, endpoints, blocked and answered counts"
  - id: reached-application
    description: "Whether any was passed on (alerted) and answered"
  - id: blob-shapes
    description: "The parameter shapes: dense base64 or serialized structures in parameters that normally hold plain values"
  - id: host-aftermath
    description: "The web server's outbound connections, new processes or services afterwards, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-deserialization, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
