# NTLM relay: authentication captured and replayed to another host. A draft; its
# lab scenario is not written yet (T-060): approval sets status, approved_by and
# content_hash (skills/README.md).
id: windows-ntlm-relay
version: 1.0.0
status: draft
owner: soc-engineering
summary: "NTLM relay: an attacker captures a host's or user's NTLM authentication on the wire and replays it to another machine."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1557.001]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4776 NTLM credential validation on domain controllers with the account and the workstation, and 4624 type 3 logons whose source host and account pairing is new or odd"
    required: true
  - telemetry_class: windows
    events:
      - "5140 and 5145 share access that followed the relayed logons, and 4768 TGT requests of the same accounts elsewhere"
    required: false
required_evidence:
  - id: odd-pairings
    description: "The logon and validation pairs: account, source host, target host, and which pairings are new"
  - id: relay-geometry
    description: "Chains where one host's authentication lands on another host uninvited: machine accounts onto servers, workstations onto workstations"
  - id: session-use
    description: "What the relayed logon did: shares, execution, directory access"
  - id: capture-origin
    description: "Where the capture could have happened: the account's and hosts' earlier windows, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-ntlm-relay, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
