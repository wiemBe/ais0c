# Credential stuffing against login endpoints. A draft; its lab scenario is not written
# yet (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: web-credential-stuffing
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Credential stuffing: stolen username and password pairs replayed against the bank's web login endpoints, many usernames per source in the WAF request log."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  # Stuffing is brute force with stolen credentials (T1110.004); the method also reads as
  # spraying when the list is thin, so the parent technique offers it too.
  attack_techniques: [T1110, T1110.004]
required_telemetry:
  - telemetry_class: waf
    events:
      - "Request log of login endpoints: attempts per ip_client across many usernames, with request_status, response codes and user_agent"
    required: true
  - telemetry_class: firewall
    events:
      - "Traffic of the same sources at the firewall, and any VPN logins of the successfully stuffed accounts"
    required: false
required_evidence:
  - id: attempt-pattern
    description: "Per source: distinct usernames tried, attempts per username, time span and the share that failed"
  - id: success-share
    description: "How many attempts were answered as accepted logins, as far as the response codes and session events show"
  - id: credential-source
    description: "Whether the usernames fit the organization's account scheme and whether a known breach explains the list"
  - id: compromised-accounts
    description: "The accounts that were logged into, and what those sessions did next"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-credential-stuffing, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
