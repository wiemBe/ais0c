# Lateral movement through remote services (SMB, RDP, WinRM). A draft; its lab scenario is
# not written yet (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-lateral-movement
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Lateral movement: an account logs onto host after host through remote services (SMB admin shares, RDP, WinRM), on the way from one compromised host to the rest."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1021.001, T1021.002, T1021.006]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4624 logons with the logon type and the source address: type 3 SMB and WinRM, type 10 RDP"
      - "5140 and 5145 network share object accessed, for administrative share use"
    required: true
  - telemetry_class: windows
    events:
      - "4648 logons with explicit credentials"
      - "7045 service installs and 4688 process creation on the hosts that were reached"
    required: false
  - telemetry_class: firewall
    events:
      - "Traffic between server VLANs involving the source host, when the path crosses the firewall"
    required: false
required_evidence:
  - id: logon-spread
    description: "The account's 4624 logons in the window: hosts, logon types and source addresses"
  - id: new-hosts
    description: "Which of those hosts the account had not logged on to before, or a data gap without a baseline"
  - id: share-and-service-use
    description: "Administrative share access, service installs or remote tool execution on the hosts that were reached"
  - id: credentials-used
    description: "Which account ran the logons, and any 4648 explicit-credential logons underneath"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-lateral-movement, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
