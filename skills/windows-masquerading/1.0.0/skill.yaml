# Masquerading: binaries and paths that imitate system software. A draft; its lab
# scenario is not written yet (T-060): approval sets status, approved_by and
# content_hash (skills/README.md).
id: windows-masquerading
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Masquerading: a program runs under a name or in a place that imitates system software, so a glance at a process list sees nothing."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1036, T1036.003, T1036.005]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4688 process creation where name and path disagree: system-looking names in user-writable paths, program names with padded or homoglyph spellings, or right-to-left overrides in names"
    required: true
  - telemetry_class: windows
    events:
      - "4663 executions and writes of the imitating binaries, and the host's later network in the firewall log"
    required: false
required_evidence:
  - id: mismatch-events
    description: "The processes whose name and path disagree: name, path, subject and time"
  - id: imitation-target
    description: "What is being imitated: a system binary, a known admin tool, or a vendor's updater"
  - id: real-program
    description: "What the imitating binary actually is, as far as logs show: its path's writability, its parent, its network"
  - id: host-context
    description: "The host's window: how the binary arrived and what it did"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-masquerading, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
