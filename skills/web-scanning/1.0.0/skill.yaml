# Vulnerability scanning against the web surface. A draft built on the lab's
# s8-waf-tarama-engellendi and s9-onayli-tarayici scenarios (T-058): approval sets status,
# approved_by and content_hash (skills/README.md).
id: web-scanning
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Automated vulnerability scanning of the bank's web surface: one source walks many endpoints with several attack signature families in a short time."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1595.002]
required_telemetry:
  - telemetry_class: waf
    events:
      - "Request log: attack_type (Vulnerability Scan or several families), request_status, response_code, ip_client, uri, user_agent and violation_rating"
    required: true
  - telemetry_class: firewall
    events:
      - "Traffic of the scanning source at the firewall, for connections the WAF does not see"
    required: false
required_evidence:
  - id: scan-summary
    description: "Per source address: request count, distinct attack families and URIs, time span, blocked and alerted counts"
  - id: reached-application
    description: "Whether every request was blocked, or any was passed on (alerted) and answered"
  - id: source-assessment
    description: "Whether the source is internal or external, and whether the organization context lists it as an approved scanner"
  - id: scan-purpose
    description: "What came after the scan, if the window allows: focused attacks on the endpoints the scan found"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-scanning, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
