# Suspicious command shell execution. A draft; its lab scenario is not written yet
# (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-command-shell-anomaly
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1059.003]
required_telemetry:
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4688 process creation: cmd.exe with chained, redirected or obfuscated argument shapes, and the parent process that started it"
    required: true
  - log_source_type: Fortinet FortiGate Security Gateway
    events:
      - "Traffic of the host after the execution, for shells calling out to fetch more"
    required: false
required_evidence:
  - id: command-shape
    description: "The command line: chained commands, output redirection into files, encoded fragments, tool invocations"
  - id: parent-process
    description: "Which process started the shell: a user session, a service, a web or database worker"
  - id: host-context
    description: "The host's window before: logons, uploads, services that explain where the shell came from"
  - id: what-followed
    description: "The processes the shell started and the network it opened, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-command-shell-anomaly, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
