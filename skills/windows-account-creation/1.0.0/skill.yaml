# New account creation as persistence. A draft; its lab scenario is not written yet
# (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: windows-account-creation
version: 1.0.0
status: draft
owner: soc-engineering
summary: "A new account created to keep access: after a compromise, an intruder with administrative rights creates an account that looks like routine infrastructure."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1136, T1136.001, T1136.002]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4720 on domain controllers and members: a user account was created, with the subject, the new account and the host"
    required: true
  - telemetry_class: windows
    events:
      - "4722 account enabled, 4724 password reset, 4728, 4732 and 4756 group additions of the new account"
      - "4624 logons of the new account after its creation"
    required: false
required_evidence:
  - id: creation-event
    description: "The 4720 event: subject account, new account name, host and time"
  - id: subject-role
    description: "Who created the account: the subject's role and host in the organization context"
  - id: account-lifecycle
    description: "What followed: enable, password reset, group additions, and the first logons of the new account"
  - id: naming-pattern
    description: "Whether the account name fits the organization's naming scheme or mimics an administrative one"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-account-creation, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
