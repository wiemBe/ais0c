# Malicious file upload towards a web shell. A draft; its lab scenario is not written yet
# (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: web-file-upload
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  # The upload is the entry (T1190); a planted shell is persistence on the server
  # (T1505.003). The skill covers both halves.
  attack_techniques: [T1190, T1505.003]
required_telemetry:
  - log_source_type: F5 Networks BIG-IP ASM
    events:
      - "Request log of upload endpoints: executable or script file name patterns in the requests, with sig_names, request_status and response_code"
    required: true
  - log_source_type: Fortinet FortiGate Security Gateway
    events:
      - "Later requests from the same or another source to the uploaded file's path, and traffic from the web server afterwards"
    required: false
required_evidence:
  - id: upload-requests
    description: "The upload attempts: source, endpoint, the file name patterns and whether the application accepted them"
  - id: shell-path-requests
    description: "Any later request to an uploaded file's path, from any source: the shell being used"
  - id: reached-application
    description: "Whether uploads or path requests were passed on (alerted) and answered"
  - id: server-followup
    description: "What the web server did after answered requests: outbound connections and volume, or a data gap"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-file-upload, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
