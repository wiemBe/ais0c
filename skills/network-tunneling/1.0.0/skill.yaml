# Tunnels: DNS and protocol layering out of the network. A draft; its lab
# scenario is not written yet (T-060): approval sets status, approved_by and
# content_hash (skills/README.md).
id: network-tunneling
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1071.004, T1572]
required_telemetry:
  - telemetry_class: firewall
    events:
      - "Traffic log: per internal host, DNS query volume and session anomalies, long-lived single-session tunnels, and unusual-protocol egress (large or steady ICMP, odd UDP patterns), with destinations and volume"
    required: true
  - telemetry_class: windows
    events:
      - "The host's process events for the tunneling program, where they reach QRadar"
    required: false
required_evidence:
  - id: dns-anomaly
    description: "Per host: query counts against baseline, query-name lengths and shapes, and the resolvers used"
  - id: session-anomaly
    description: "Long-lived sessions and their volume: one connection carrying a workload"
  - id: owner
    description: "The program behind the anomaly, or a data gap"
  - id: content-shape
    description: "What the tunnel moved: steady control chatter, or upload spikes (the exfiltration skill's method)"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-network-tunneling, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
