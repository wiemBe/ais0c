# Remote access software on internal hosts. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: remote-access-tool-usage
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1219]
required_telemetry:
  - log_source_type: Fortinet FortiGate Security Gateway
    events:
      - "Traffic log: connections to the remote-access services' known endpoints and ports from internal hosts, with duration and volume"
    required: true
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4688 process creation of the remote-access tools' program names, and their installation events (7045, msi shapes)"
    required: false
required_evidence:
  - id: tool-traffic
    description: "The connections: internal host, the service's endpoints, ports, times, duration and volume"
  - id: tool-identity
    description: "Which service it is, and whether the organization context permits it anywhere"
  - id: install-and-user
    description: "Who installed and ran it, from the host's process events where they reach QRadar"
  - id: session-shape
    description: "The sessions' shape: support-length, workday-long, or around-the-clock"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-remote-access-tool-usage, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
