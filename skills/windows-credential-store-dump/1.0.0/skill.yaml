# At-rest credential stores dumped: SAM, the domain database and LSA secrets. A
# draft; its lab scenario is not written yet (T-060): approval sets status,
# approved_by and content_hash (skills/README.md).
id: windows-credential-store-dump
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1003.002, T1003.003, T1003.004]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4688 process creation with dump argument shapes: registry save and export commands for the account and security hives, directory-database maintenance tools in dump modes, and snapshot or shadow-copy creation on domain controllers"
    required: true
  - telemetry_class: windows
    events:
      - "4663 reads of the directory database files on domain controllers, and the host's later authentication anomalies elsewhere"
    required: false
required_evidence:
  - id: dump-events
    description: "The dump-shaped processes: tool, arguments, account, host and time"
  - id: store-assessment
    description: "Which store was in reach: the local account database, the domain database, the LSA secrets"
  - id: arrival
    description: "How the tooling arrived: logons, services, tasks before the dump"
  - id: credential-use
    description: "Authentication anomalies afterwards: NTLM spread, new-source logons of the exposed accounts (the pass-the-hash skill's method)"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-credential-store-dump, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
