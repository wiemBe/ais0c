# Cross-site scripting against a web application behind the WAF. A draft built on the lab's
# s7-waf-xss-gecti scenario (T-058): approval sets status, approved_by and content_hash.
id: web-xss
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1189]
required_telemetry:
  - log_source_type: F5 Networks BIG-IP ASM
    events:
      - "Request log with attack_type Cross Site Scripting (XSS): sig_names, request_status, response_code, ip_client, uri, query_string and user_agent"
    required: true
  - log_source_type: Fortinet FortiGate Security Gateway
    events:
      - "Traffic from the web server to external addresses after the requests, for script content loaded from outside"
    required: false
required_evidence:
  - id: request-summary
    description: "Per source address: request count, signature families, request_status values and response codes"
  - id: reached-application
    description: "Whether any request was passed on (alerted) and answered by the application"
  - id: reflected-or-stored
    description: "Whether the script content was sent once to one endpoint or later fetched again by other sessions, as far as the logs show"
  - id: source-scope
    description: "Other requests and attack families from the same source, and other sources probing the same endpoint"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-web-xss, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
