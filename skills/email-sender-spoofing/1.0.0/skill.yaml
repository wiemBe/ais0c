# Sender spoofing against the bank's mailboxes. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: email-sender-spoofing
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1566.002]
required_telemetry:
  - telemetry_class: email-security
    events:
      - "Gateway events: sender authentication verdicts (sender policy, signature, alignment), the claimed sender against the actual, display names and reply-to divergence, with recipients and delivery verdicts"
    required: true
  - telemetry_class: email-security
    events:
      - "The campaign's subject and link shapes, where the gateway records them"
    required: false
  - telemetry_class: firewall
    events:
      - "Internal traffic to the spoofed mail's link destinations"
    required: false
required_evidence:
  - id: auth-failures
    description: "The messages failing sender authentication: which checks failed and how badly"
  - id: impersonation-pairs
    description: "Who was impersonated - executives, finance, partners - and which recipients were chosen"
  - id: reply-divergence
    description: "Reply-to and display-name tricks that steer answers to the attacker"
  - id: ask-and-follow
    description: "What the mail asked for, and whether recipients answered: replies, submissions, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-email-sender-spoofing, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
