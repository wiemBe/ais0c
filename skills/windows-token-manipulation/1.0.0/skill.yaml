# Access token manipulation and impersonation. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: windows-token-manipulation
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1134, T1134.001]
required_telemetry:
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4624 logons with logon type 9 (new credentials) and the accounts and addresses involved, and 4673 and 4674 sensitive privilege use by accounts outside their normal roles"
    required: true
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "4688 process creation with runas and impersonation argument shapes, and 4624 logon type 3 from the same hosts"
    required: false
required_evidence:
  - id: impersonation-events
    description: "The type 9 logons: caller account, target account, host and time"
  - id: privilege-use
    description: "The 4673 and 4674 events: which sensitive privileges, used by which accounts, on which hosts"
  - id: fit-with-software
    description: "Whether the host's documented services legitimately impersonate accounts (application pools, middleware)"
  - id: acted-as
    description: "What was done under the impersonated identity: logons, shares, changes afterwards"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-token-manipulation, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
