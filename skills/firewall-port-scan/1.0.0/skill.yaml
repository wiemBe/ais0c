# Port and service scanning seen at the firewall. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash (skills/README.md).
id: firewall-port-scan
version: 1.0.0
status: draft
owner: soc-engineering
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  # Scanning from inside is Discovery (T1046); scanning from the internet is Active
  # Scanning (T1595.001). Both mappings offer the skill.
  attack_techniques: [T1046, T1595.001]
required_telemetry:
  - log_source_type: Fortinet FortiGate Security Gateway
    events:
      - "Traffic log with action deny: one source probing many destination hosts and ports in a short window"
    required: true
  - log_source_type: Microsoft Windows Security Event Log
    events:
      - "When the source is internal: the scanning host's logons, services and process events in the same window"
    required: false
required_evidence:
  - id: scan-shape
    description: "The scan: source, destination hosts and ports touched, protocol, time span and rate"
  - id: target-pattern
    description: "What was scanned: one host's every port, many hosts' one service, or a range swept"
  - id: what-answered
    description: "Which probes were allowed through, and what answered behind the firewall"
  - id: source-assessment
    description: "The source: internal or external, its history, and whether the organization context explains it"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-firewall-port-scan, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
