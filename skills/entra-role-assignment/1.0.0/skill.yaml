# Cloud role assignments as persistence. A draft; its lab scenario is not
# written yet (T-060): approval sets status, approved_by and content_hash
# (skills/README.md).
id: entra-role-assignment
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Cloud role assignment abuse: an account was given a directory role it should not hold, permanently or activated quietly."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1098.003]
required_telemetry:
  - telemetry_class: identity-cloud
    events:
      - "Cloud audit log: role assignments and activations - the role, the assignee, the assigner, permanence or eligibility, and the time"
    required: true
  - telemetry_class: identity-cloud
    events:
      - "The assignee's privileged sign-ins and administrative actions afterwards"
    required: false
required_evidence:
  - id: assignment-events
    description: "The assignments and activations: role, assignee, assigner, permanence, time"
  - id: role-tier
    description: "What the role permits: directory administration, exchange, security operations tiers"
  - id: process-fit
    description: "Whether the assignment came through the sanctioned elevation workflow, per the organization context"
  - id: use-afterwards
    description: "The assignee's administrative actions in the role, or a data gap"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-entra-role-assignment, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
