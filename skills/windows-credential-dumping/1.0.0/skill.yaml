# Credential dumping against LSASS. A draft; its lab scenario is not written yet (T-060):
# approval sets status, approved_by and content_hash (skills/README.md).
id: windows-credential-dumping
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Credential dumping: a tool on a Windows host reads the memory of the local security authority process (LSASS), where credentials of recent logons are kept."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production QRadar's
  # rule IDs go here, never the lab's. The lab uses the technique trigger (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1003, T1003.001]
required_telemetry:
  - telemetry_class: windows
    events:
      - "4688 process creation with the command-line shapes credential-dumping tools leave, and 4656 and 4663 object access events on the LSASS process"
    required: true
  - telemetry_class: windows
    events:
      - "4624 logons on the host before the dump, and 7045 service installs in the same window"
    required: false
required_evidence:
  - id: dump-attempt
    description: "The events that show a tool touching LSASS or running a dump command shape: process, subject, host and time"
  - id: arrival-path
    description: "How the tool arrived: the host's logons, services and tasks before the attempt"
  - id: what-ran
    description: "The process's identity as far as the logs show it: name, command-line shape, signature presence or absence"
  - id: followup-use
    description: "Authentication anomalies with the host's accounts afterwards: NTLM spread, new logons from new sources"
# Starting values; the skill's suite measures them. One Ariel search takes at least four
# tool calls. T-062 (decision T-85): the token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-windows-credential-dumping, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
