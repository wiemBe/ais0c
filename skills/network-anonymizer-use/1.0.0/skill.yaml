# Anonymizers and consumer VPNs hiding egress destinations. A draft; its lab
# scenario is not written yet (T-060): approval sets status, approved_by and
# content_hash (skills/README.md).
id: network-anonymizer-use
version: 1.0.0
status: draft
owner: soc-engineering
summary: "Anonymizer use: internal hosts sending traffic through commercial VPN, proxy and anonymizer services, so the destination behind them cannot be seen."
allowed_agent_roles: [investigation]
triggers:
  # QRadar rule IDs differ between installations: before approval the production
  # QRadar's rule IDs go here, never the lab's. The lab uses the technique trigger
  # (decision T-26).
  rule_ids: []
  log_source_types: []
  attack_techniques: [T1090.003]
required_telemetry:
  - telemetry_class: firewall
    events:
      - "Traffic log: connections from internal hosts to anonymizer, commercial VPN and consumer proxy endpoint ranges, with byte volume, session shapes and times"
    required: true
  - telemetry_class: windows
    events:
      - "The host's process events for the client programs behind the connections, where they reach QRadar"
    required: false
required_evidence:
  - id: anonymizer-map
    description: "Per host: the services' endpoints, session counts, volume, and the hours chosen"
  - id: purpose-shape
    description: "The traffic's shape: interactive browsing, steady channel, or bulk transfer"
  - id: host-context
    description: "The host's other indicators: beaconing shapes, odd-port channels, staging - or their absence"
  - id: sanction-fit
    description: "Whether the organization context sanctions any such service, for any host"
# Starting values; the skill's suite measures them. T-062 (decision T-85): the
# token limit is a runaway guard, not a constraint.
budgets:
  tokens: 600000
  tool_calls: 24
  wall_clock_seconds: 360
output_schema: InvestigationResult
eval_suites: [skill-network-anonymizer-use, prompt-injection, adversarial-fn]
expires_at: 2027-10-01
content_hash: null
approved_by: null
