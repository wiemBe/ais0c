[project]
name = "ais0c-api"
version = "0.1.0"
description = "FastAPI service behind the analyst UI."
requires-python = ">=3.12"
dependencies = [
    "ais0c-contracts",
    "ais0c-storage",
    # The HTTP service the UI talks to (architecture §24, T-13).
    "fastapi>=0.142.2,<0.143",
    # The ASGI server `python -m ais0c_api` runs on.
    "uvicorn>=0.54,<0.55",
    # Temporal client, only to trigger the KnowledgeSync Schedule (`POST /catalog/sync`).
    "temporalio>=1.34,<2",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
    # The ASGI test client of the API tests, and the PostgreSQL container they run against.
    "httpx2>=2.13.1,<3",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
