[project]
name = "ais0c-worker"
version = "0.1.0"
description = "Temporal workers for the case, hunt and batch task queues."
requires-python = ">=3.12"
dependencies = [
    "ais0c-workflows",
    "ais0c-activities",
    # Worker, client and Schedules.
    "temporalio[pydantic]>=1.34,<2",
    # PydanticAIPlugin: the data converter and sandbox settings agent runs need (decision T-02).
    "pydantic-ai-slim[temporal]>=2.53,<3",
    # `model_release verify` (T-016): the vLLM requests, the LiteLLM configuration and vLLM's
    # answers. Same ranges as the other members.
    "httpx2>=2.13.1,<3",
    "pyyaml>=6.0.3,<7",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "anyio>=4.15,<5",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
