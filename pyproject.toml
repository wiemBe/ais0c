# Workspace root of the ais0c Python monorepo.
#
# The root is virtual (no [project] table): `uv sync` installs every workspace member in
# editable mode plus the `dev` dependency group. Package layout and the allowed imports
# between packages: docs/impl/repo-structure.md.

[tool.uv]
required-version = ">=0.12.22"

[tool.uv.workspace]
members = [
    "packages/*",
    "services/api",
    "services/mcp-gateway",
    "services/worker",
    "harness",
]

# Members inherit these sources, so an internal dependency is declared by name only.
[tool.uv.sources]
ais0c-activities = { workspace = true }
ais0c-agents = { workspace = true }
ais0c-contracts = { workspace = true }
ais0c-executor = { workspace = true }
ais0c-knowledge = { workspace = true }
ais0c-policy = { workspace = true }
ais0c-querylang = { workspace = true }
ais0c-storage = { workspace = true }
ais0c-workflows = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.15,<3",
    "pyright[nodejs]>=1.1.414,<1.2",
    "pytest>=9.1.1,<10",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.16.10,<0.17",
]

# --- ruff ---------------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
# Ruff would otherwise format Python blocks inside Markdown. Docs are human-owned and prompt
# hashes depend on the exact bytes of prompts/*.md, so Markdown is left alone.
# services/qradar-mcp is the fork (D-46): its own Python 3.11 project with its own tests.
extend-exclude = ["*.md", "services/qradar-mcp"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear: likely bugs
    "UP",    # pyupgrade: syntax for the target Python version
    "S",     # flake8-bandit: security smells
    "RUF",   # ruff-specific rules
    "ANN",   # flake8-annotations: public functions are fully typed (AGENTS.md)
    "ASYNC", # blocking calls inside async code (FastAPI, Pydantic AI, Temporal activities)
    "BLE",   # blind `except Exception`: security checks fail closed
    "DTZ",   # naive datetimes: timestamps are timezone-aware UTC
    "PT",    # flake8-pytest-style
]
ignore = [
    "E501", # line length is left to the formatter
]
# User-facing text is Turkish; RUF001-RUF003 would report the dotless "ı" as a look-alike of "i".
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"] # pytest checks with plain assert

[tool.ruff.lint.isort]
known-first-party = ["ais0c_*"]

# --- pyright ------------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["packages/contracts", "packages/policy"]
# Listing `exclude` drops pyright's defaults, so they are repeated. The fork is not ours.
exclude = ["services/qradar-mcp", "**/node_modules", "**/__pycache__", "**/.*"]

# --- pytest -------------------------------------------------------------------------------

[tool.pytest]
minversion = "9.1"
testpaths = ["packages", "services", "harness", "tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    # The fork (D-46) has its own tests, run in their own CI job.
    "--ignore=services/qradar-mcp",
    # Registers the `lab` marker. Lab tests are skipped unless QRADAR_LAB_URL and
    # QRADAR_LAB_TOKEN are set.
    "-p",
    "ais0c_harness.pytest_plugin",
]
strict = true
filterwarnings = ["error"]

# --- import-linter ------------------------------------------------------------------------
#
# One `forbidden` contract per row of the dependency table in docs/impl/repo-structure.md.
# Each lists every other ais0c package except the ones that row allows. The table is about
# direct imports, so indirect ones are allowed (worker -> activities -> storage is fine);
# every hop is checked by the importing package's own contract.
#
# harness is not in the table: it may import any package, but no package may import it.

[tool.importlinter]
root_packages = [
    "ais0c_contracts",
    "ais0c_policy",
    "ais0c_querylang",
    "ais0c_storage",
    "ais0c_knowledge",
    "ais0c_agents",
    "ais0c_activities",
    "ais0c_workflows",
    "ais0c_executor",
    "ais0c_api",
    "ais0c_worker",
    "ais0c_mcp_gateway",
    "ais0c_harness",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports no other ais0c package"
type = "forbidden"
source_modules = ["ais0c_contracts"]
forbidden_modules = [
    "ais0c_policy",
    "ais0c_querylang",
    "ais0c_storage",
    "ais0c_knowledge",
    "ais0c_agents",
    "ais0c_activities",
    "ais0c_workflows",
    "ais0c_executor",
    "ais0c_api",
    "ais0c_worker",
    "ais0c_mcp_gateway",
    "ais0c_harness",
]
allow_indirect_imports = true
broken_contract_guidance = "Allowed imports: dependency table in docs/impl/repo-structure.md. Changing it is a human decision; do not loosen this contract."

[[tool.importlinter.contracts]]
name = "policy imports only contracts"
type = "forbidden"
source_modules = ["ais0c_policy"]
